name: Bug report
description: Report a reproducible issue in SPECTRA-32.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Do not include credentials, device identifiers, raw traffic captures, or details about systems you are not authorized to test.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the full error text after removing secrets and identifiers.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: List the smallest steps that reproduce the issue.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, and relevant dependency versions.
    validations:
      required: true
  - type: dropdown
    id: validation
    attributes:
      label: Validation path
      options:
        - Streamlit session model
        - Standalone HTTP node
        - MQTT broker integration
        - ESP-IDF firmware or physical hardware
        - Documentation or workflow page
    validations:
      required: true
