name: Python quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.6
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install locked application and development dependencies
        run: uv sync --locked --group dev

      - name: Audit the locked environment
        run: uv run --locked --group dev pip-audit

      - name: Lint Python sources
        run: uv run --locked --group dev ruff check --select E4,E7,E9,F data services components simulator tests tools

      - name: Compile project modules
        run: uv run --locked --group dev python -m compileall -q data services components simulator tests tools

      - name: Check documentation links
        run: uv run --locked --group dev python tools/check_docs.py

      - name: Run tests
        run: uv run --locked --group dev python -m unittest discover -s tests -v
