name: Python quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mqtt-integration:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.6
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install Mosquitto broker
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y mosquitto
          sudo systemctl stop mosquitto || true

      - name: Install locked application and development dependencies
        run: uv sync --locked --group dev

      - name: Exercise MQTT command and status flow on loopback
        run: uv run --locked --group dev python -m unittest discover -s tests -p "test_node_mqtt.py" -v

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.6
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install locked application and development dependencies
        run: uv sync --locked --group dev

      - name: Run canonical verification suite
        run: uv run --locked --group dev python tools/verify.py

      - name: Export locked runtime SBOM
        if: matrix.python-version == '3.14'
        run: uv --preview-features sbom-export export --locked --format cyclonedx1.5 --no-dev --output-file spectra32-runtime.cdx.json

      - name: Validate runtime SBOM
        if: matrix.python-version == '3.14'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          sbom = json.loads(Path("spectra32-runtime.cdx.json").read_text(encoding="utf-8"))
          assert sbom.get("bomFormat") == "CycloneDX", "unexpected SBOM format"
          assert sbom.get("specVersion") == "1.5", "unexpected CycloneDX version"
          components = sbom.get("components", [])
          assert components, "runtime SBOM contains no components"
          names = {component.get("name", "").casefold() for component in components}
          assert not any("ruff" in name for name in names), "development dependency leaked into runtime SBOM"
          assert not any("pip-audit" in name or "pip_audit" in name for name in names), (
              "development dependency leaked into runtime SBOM"
          )
          root = sbom.get("metadata", {}).get("component", {}).get("name")
          assert root == "vigil-spectra-32", f"unexpected project metadata: {root!r}"
          print(f"Validated CycloneDX 1.5 runtime SBOM with {len(components)} components")
          PY

      - name: Upload runtime SBOM
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: spectra32-python-runtime-sbom
          path: spectra32-runtime.cdx.json
          if-no-files-found: error
          retention-days: 30
