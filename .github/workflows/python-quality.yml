name: Python quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            simulator/requirements.txt
            requirements-dev.txt

      - name: Install pinned application dependencies
        run: python -m pip install -r requirements.txt

      - name: Install pinned development checks
        run: python -m pip install -r requirements-dev.txt

      - name: Audit resolved runtime dependencies
        run: |
          pip-audit -r requirements.txt
          pip-audit -r requirements-dev.txt

      - name: Lint Python sources
        run: ruff check --select E4,E7,E9,F data services components simulator tests tools

      - name: Compile project modules
        run: python -m compileall -q data services components simulator tests tools

      - name: Check documentation links
        run: python tools/check_docs.py

      - name: Run tests
        run: python -m unittest discover -s tests -v
