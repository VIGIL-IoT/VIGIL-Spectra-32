name: Build and deploy experiment workflow page

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out SPECTRA-32 without Git LFS objects
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: false

      - name: Check out pinned Archify renderer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: tt-a1i/archify
          ref: 208acba8d412335185b2056fedf54b3405df43fb
          path: .tools/archify
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Install pinned Archify dependencies
        working-directory: .tools/archify/archify
        run: npm ci --ignore-scripts

      - name: Validate and regenerate workflow diagram
        shell: bash
        run: |
          candidate=".archify/workflow-spectra32-security-research-20261026-200334/candidate.json"
          diagram=".archify/workflow-spectra32-security-research-20261026-200334/spectra-32-research-workflow.html"
          node .tools/archify/archify/bin/archify.mjs validate workflow "$candidate" --quality showcase --json
          node .tools/archify/archify/bin/archify.mjs render workflow "$candidate" "$diagram" --quality showcase
          node -e 'const fs=require("node:fs"); const file=process.argv[1]; fs.writeFileSync(file,fs.readFileSync(file,"utf8").replaceAll(String.fromCodePoint(0x2014),"-"));' "$diagram"
          sed -i 's/[[:blank:]]*$//' "$diagram"
          git diff --exit-code -- "$diagram"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Assemble public site allowlist
        shell: bash
        run: |
          mkdir -p _site
          cp docs/site/workflow/index.html _site/index.html
          cp .archify/workflow-spectra32-security-research-20261026-200334/spectra-32-research-workflow.html _site/spectra-32-workflow.html
          cp .archify/workflow-spectra32-security-research-20261026-200334/candidate.json _site/workflow-source.json
          cp docs/site/workflow/third-party-notices.html _site/third-party-notices.html
          cp THIRD_PARTY_NOTICES.md _site/third-party-notices.md
          mkdir -p _site/licenses
          cp licenses/third-party/archify-MIT.txt _site/licenses/archify-MIT.txt
          cp licenses/third-party/JetBrains-Mono-OFL.txt _site/licenses/JetBrains-Mono-OFL.txt
          touch _site/.nojekyll
          test "$(find _site -type f | wc -l)" -eq 8

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
